version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omsi2_postgres
    environment:
      POSTGRES_USER: omsi_user
      POSTGRES_PASSWORD: omsi_password
      POSTGRES_DB: omsi2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omsi_user -d omsi2_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: omsi2_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://omsi_user:omsi_password@postgres:5432/omsi2_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
